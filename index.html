<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ChatLampo</title>

  <!-- Collegamento Manifest e Icona PWA per Installazione Nativa -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#252525">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/9374/9374982.png">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/9374/9374982.png">

  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <main class="app-viewport">
    
    <!-- INTESTAZIONE -->
    <header class="app-header">
      <h1>☕ ChatLampo</h1>
      <p>La tua pausa, la tua chat temporanea.</p>
    </header>

    <!-- SCHERMATA HOME / SELEZIONE STANZA -->
    <section id="intro-screen" class="screen-panel">
      <button id="btn-public" class="btn btn-success">🌐 Entra nella Chat Pubblica</button>
      
      <div class="divider"><span>oppure stanza privata</span></div>

      <div class="private-box">
        <button id="btn-create" class="btn btn-secondary">Crea Stanza Privata</button>
        <div class="join-row">
          <input type="text" id="room-code-input" placeholder="Codice Stanza" maxlength="10">
          <button id="btn-join" class="btn btn-primary">Entra</button>
        </div>
      </div>
    </section>

    <!-- SCHERMATA CHAT -->
    <section id="chat-screen" class="screen-panel" style="display: none;">
      
      <div class="room-bar">
        <span>Stanza: <strong id="room-code-display">---</strong></span>
        <div class="room-bar-actions">
          <button id="btn-admin" class="icon-btn-small" title="Modalità moderatore">🔑</button>
          <button id="btn-leave" class="btn-danger">Esci</button>
        </div>
      </div>

      <div id="messages" class="chat-history"></div>

      <div class="chat-controls">
        <input type="file" id="camera-input" accept="image/*" capture="environment" hidden>
        <button id="btn-camera" class="icon-btn" title="Scatta foto">📷</button>

        <input type="file" id="gallery-input" accept="image/*" hidden>
        <button id="btn-gallery" class="icon-btn" title="Galleria">🖼️</button>

        <input type="text" id="message-input" placeholder="Scrivi un messaggio...">
        <button id="btn-send" class="btn btn-primary">Invia</button>
      </div>

    </section>

  </main>

  <script src="supabase.js"></script>
  <script src="app.js"></script>

  <!-- Attivazione Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
