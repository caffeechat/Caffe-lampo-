<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pausa Caffè - Chat Anonima</title>
    
    <meta name="theme-color" content="#120D0A">
    <link rel="icon" type="image/png" href="icona.png">
    
    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Socket.io -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <style>
        :root {
            --bg-primary: #120D0A;
            --bg-secondary: #1A130E;
            --bg-card: #241C15;
            --bg-hover: #2E241C;
            --accent-primary: #D97706;
            --accent-hover: #B45309;
            --accent-light: #F59E0B;
            --text-main: #F3F4F6;
            --text-muted: #9CA3AF;
            --border-color: #362A20;
            --msg-sent: #D97706;
            --msg-received: #2A2119;
            --online-green: #10B981;
            --danger-red: #EF4444;
            --radius-sm: 8px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-family); }
        body, html { height: 100%; width: 100%; background-color: var(--bg-primary); color: var(--text-main); overflow: hidden; display: flex; justify-content: center; align-items: center; }

        .app-container { width: 100%; max-width: 600px; height: 100%; max-height: 100vh; background-color: var(--bg-secondary); display: flex; flex-direction: column; position: relative; }
        @media (min-width: 600px) { .app-container { height: 92vh; border-radius: var(--radius-lg); border: 1px solid var(--border-color); } }

        .app-header { padding: 16px 20px; background-color: rgba(26, 19, 14, 0.95); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; }
        .brand-info { display: flex; align-items: center; gap: 12px; }
        .brand-icon { width: 40px; height: 40px; background: linear-gradient(135deg, #D97706, #78350F); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .brand-text h1 { font-size: 1.1rem; font-weight: 700; }
        .brand-text p { font-size: 0.75rem; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: var(--online-green); display: inline-block; }

        .screen { flex: 1; display: none; flex-direction: column; overflow: hidden; position: relative; }
        .screen.active { display: flex; }

        .lobby-content { flex: 1; padding: 30px 24px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 24px; }
        .cup-container { width: 90px; height: 90px; background: #2A2018; border: 2px solid var(--border-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 42px; }

        .btn-primary { width: 100%; max-width: 340px; padding: 16px 24px; background: linear-gradient(135deg, var(--accent-primary), var(--accent-hover)); color: white; border: none; border-radius: var(--radius-md); font-size: 1rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

        .searching-state { display: none; flex-direction: column; align-items: center; gap: 16px; }
        .searching-state.active { display: flex; }
        .spinner { width: 28px; height: 28px; border: 3px solid rgba(217, 119, 6, 0.2); border-top-color: var(--accent-primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Chat */
        .chat-messages { flex: 1; padding: 20px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .system-msg { align-self: center; background: rgba(36, 28, 21, 0.8); border: 1px solid var(--border-color); color: var(--text-muted); font-size: 0.78rem; padding: 8px 16px; border-radius: 20px; }
        .message { max-width: 80%; display: flex; flex-direction: column; gap: 4px; }
        .message.sent { align-self: flex-end; }
        .message.received { align-self: flex-start; }
        .msg-bubble { padding: 12px 16px; border-radius: 18px; font-size: 0.92rem; word-break: break-word; }
        .message.sent .msg-bubble { background-color: var(--msg-sent); color: white; }
        .message.received .msg-bubble { background-color: var(--msg-received); color: var(--text-main); border: 1px solid var(--border-color); }

        .chat-input-area { padding: 12px 16px; background-color: var(--bg-card); border-top: 1px solid var(--border-color); display: flex; align-items: center; gap: 10px; }
        .input-wrapper { flex: 1; background-color: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 24px; padding: 4px 16px; }
        .chat-input { width: 100%; background: none; border: none; color: var(--text-main); font-size: 0.95rem; outline: none; padding: 8px 0; }
        .btn-send { width: 42px; height: 42px; border-radius: 50%; background: var(--accent-primary); color: white; border: none; cursor: pointer; }
        .chat-controls { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: var(--bg-primary); border-top: 1px solid var(--border-color); }
        .btn-next { background: rgba(239, 68, 68, 0.15); color: var(--danger-red); border: 1px solid rgba(239, 68, 68, 0.3); padding: 8px 18px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="app-header">
            <div class="brand-info">
                <div class="brand-icon">☕</div>
                <div class="brand-text">
                    <h1>Pausa Caffè</h1>
                    <p id="header-status"><span class="status-dot" id="status-dot" style="background:#F59E0B"></span> Connessione...</p>
                </div>
            </div>
        </header>

        <!-- LOBBY SCREEN -->
        <main class="screen active" id="screen-lobby">
            <div class="lobby-content">
                <div class="cup-container">☕</div>
                <div>
                    <h2>Pausa Caffè</h2>
                    <p style="color: var(--text-muted); margin-top: 6px;">Chat anonima in tempo reale</p>
                </div>

                <div class="searching-state" id="searching-state">
                    <div class="spinner"></div>
                    <p style="color: var(--accent-light); font-weight: 600;">Ricerca partner in corso...</p>
                </div>

                <button class="btn-primary" id="start-chat-btn">
                    <i class="fa-solid fa-comments"></i>
                    <span id="start-btn-text">Trova uno Sconosciuto</span>
                </button>
            </div>
        </main>

        <!-- CHAT SCREEN -->
        <main class="screen" id="screen-chat">
            <div class="chat-messages" id="chat-messages">
                <div class="system-msg">Sei connesso con uno sconosciuto!</div>
            </div>

            <div class="chat-controls">
                <button class="btn-next" id="next-partner-btn">Chiudi Chat</button>
            </div>

            <div class="chat-input-area">
                <div class="input-wrapper">
                    <input type="text" class="chat-input" id="message-input" placeholder="Scrivi un messaggio...">
                </div>
                <button class="btn-send" id="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </main>
    </div>

    <script>
        // Si connette alla stessa origine del Web Service
        const socket = io({
            transports: ['polling', 'websocket'],
            reconnectionAttempts: 10,
            timeout: 20000
        });

        const headerStatus = document.getElementById('header-status');
        const statusDot = document.getElementById('status-dot');
        const startChatBtn = document.getElementById('start-chat-btn');
        const startBtnText = document.getElementById('start-btn-text');
        const searchingState = document.getElementById('searching-state');
        const screenLobby = document.getElementById('screen-lobby');
        const screenChat = document.getElementById('screen-chat');
        const chatMessages = document.getElementById('chat-messages');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const nextPartnerBtn = document.getElementById('next-partner-btn');

        let isSearching = false;

        // Gestione degli stati di connessione
        socket.on('connect', () => {
            headerStatus.innerHTML = '<span class="status-dot"></span> Online';
            startChatBtn.disabled = false;
        });

        socket.on('connect_error', () => {
            headerStatus.innerHTML = '<span class="status-dot" style="background:#EF4444"></span> Avvio server... (attendi)';
        });

        socket.on('disconnect', () => {
            headerStatus.innerHTML = '<span class="status-dot" style="background:#EF4444"></span> Disconnesso';
        });

        // Click Bottone "Trova Sconosciuto"
        startChatBtn.addEventListener('click', () => {
            if (!socket.connected) {
                alert("Il server su Render si sta svegliando dalla pausa! Attendi circa 30 secondi e riprova.");
                return;
            }

            if (!isSearching) {
                isSearching = true;
                searchingState.classList.add('active');
                startBtnText.textContent = "Annulla Ricerca";
                socket.emit('find_partner');
            } else {
                isSearching = false;
                searchingState.classList.remove('active');
                startBtnText.textContent = "Trova uno Sconosciuto";
                socket.emit('cancel_search');
            }
        });

        // Eventi Match
        socket.on('peer_connected', () => {
            isSearching = false;
            searchingState.classList.remove('active');
            startBtnText.textContent = "Trova uno Sconosciuto";

            screenLobby.classList.remove('active');
            screenChat.classList.add('active');
            chatMessages.innerHTML = '<div class="system-msg">Sei connesso con uno sconosciuto!</div>';
        });

        socket.on('peer_disconnected', () => {
            const sysMsg = document.createElement('div');
            sysMsg.className = 'system-msg';
            sysMsg.textContent = 'Lo sconosciuto si è disconnesso.';
            chatMessages.appendChild(sysMsg);
        });

        // Invio Messaggi
        function sendMessage() {
            const txt = messageInput.value.trim();
            if (txt) {
                socket.emit('send_message', { text: txt });
                addMsg(txt, 'sent');
                messageInput.value = '';
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });

        socket.on('receive_message', (data) => {
            if (data.text) addMsg(data.text, 'received');
        });

        function addMsg(txt, type) {
            const m = document.createElement('div');
            m.className = `message ${type}`;
            m.innerHTML = `<div class="msg-bubble">${txt}</div>`;
            chatMessages.appendChild(m);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Torna alla Home
        nextPartnerBtn.addEventListener('click', () => {
            socket.emit('leave_chat');
            screenChat.classList.remove('active');
            screenLobby.classList.add('active');
        });
    </script>
</body>
</html>
